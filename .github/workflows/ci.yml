name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend - Tests Maven
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Exécuter les tests backend
        run: mvn test

  frontend:
    name: Frontend - Lint, TypeScript et Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier ESLint
        run: npx ng lint

      - name: Vérifier TypeScript
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Exécuter les tests Jest
        run: npm test -- --runInBand --coverage
